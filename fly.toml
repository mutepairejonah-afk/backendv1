# fly.toml -- reconciled from `flyctl launch`'s auto-generated scaffold
# (app name/region below are the actual registered Fly app) plus fixes for
# two issues the generated scaffold got wrong for this specific backend:
#
# 1. internal_port was 8080, but this app listens on `process.env.PORT`,
#    which defaults to 3001 (see src/index.ts) and nothing here sets PORT=8080.
#    Fly would proxy to a port nothing is listening on and every health check
#    would fail. Fixed by setting internal_port to 3001 to match, via an
#    explicit PORT env var so both the app and Fly's proxy agree.
# 2. auto_stop_machines='stop' + min_machines_running=0 (scale-to-zero) would
#    silently drop this backend's long-lived Socket.IO connections
#    (src/socket.ts -- realtime messages/calls/presence) whenever traffic
#    dipped. Fixed by keeping exactly one machine always warm instead.
#
# The retention-sweep cron job stays on Render (see render.yaml and
# DEPLOY.md) -- only this web service runs on Fly.
#
# Deploy: `flyctl deploy` (app already exists from the original `flyctl
# launch` run). Secrets (anything marked `sync: false` in render.yaml) are
# set once with `flyctl secrets set KEY=value` and persist across deploys.

app = 'backendv1-wp9-qa'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
