# fly.toml app configuration file generated for backendv1-wp9-qa on 2026-09-27T06:11:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backendv1-wp9-qa'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
