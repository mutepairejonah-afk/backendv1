# Fly.io configuration for the main web service.
#
# The retention-sweep cron job stays on Render (see render.yaml) -- Fly
# doesn't have a built-in "scheduled job" service type the way Render does.
# Running a tiny daily cron isn't worth a Fly Machines-based scheduler setup
# (systemd timer / flyctl machine run on a cron trigger) when Render already
# does it natively for ~$1/month. Only this web service moves to Fly.
#
# Deploy: `flyctl launch --no-deploy` once to create the app (or edit `app`
# below to match a name you've already reserved), then `flyctl deploy`.
# Secrets (anything marked sync: false in render.yaml) are NOT set here --
# set them with `flyctl secrets set KEY=value` once per app, they persist
# across deploys.

app = "chatapp-backend"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  # Fly injects PORT automatically to match [http_service].internal_port
  # below, so it does not need to be set here.

[http_service]
  internal_port = 3001
  force_https = true
  # This backend holds long-lived Socket.IO connections (src/socket.ts) for
  # realtime messages/calls/presence. Scale-to-zero would silently drop those
  # connections whenever traffic dips, so we keep exactly one machine warm at
  # all times instead of letting Fly suspend it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
