services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - coturn

  # Self-hosted TURN/STUN relay for WebRTC calls (audio/video + AI calls).
  # The backend's /api/get-ice-servers endpoint mints short-lived HMAC-signed
  # credentials using TURN_SECRET (see src/routes/calls.ts); coturn verifies
  # them with the same shared secret via --use-auth-secret. No TURN_USERNAME/
  # TURN_CREDENTIAL (Metered.ca) fallback is needed once this is running.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command: >
      sh -c "turnserver -n --log-file=stdout
      --listening-port=${TURN_PORT:-3478}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_PUBLIC_HOST:-localhost}
      --external-ip=${TURN_PUBLIC_HOST}
      --min-port=49160 --max-port=49200
      --no-multicast-peers --no-cli"
