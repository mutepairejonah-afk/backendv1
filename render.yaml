services:
  # ai.ts, agent.ts, media.ts, and payments.ts routes moved to Supabase Edge
  # Functions (supabase/functions/ai, /media, /payments) to keep this web
  # service's compute footprint light -- see DEPLOY.md's "Supabase Edge
  # Functions" section for their required secrets and deploy commands.
  - type: web
    name: chatapp-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_CLERK_ID
        sync: false
      # Only src/socket.ts's realtime "ai:chat" event needs this on Render --
      # a tightly-coupled, same-process call on a live socket connection,
      # unlike the standalone AI endpoints (drafting, translation, moderation,
      # etc.), which moved to the `ai` Supabase Edge Function and no longer
      # run here. That event always requests the free tier, so only these two
      # keys/vars matter here; OPENROUTER_MODEL_PREMIUM/PRO are Edge Function
      # secrets now, not Render env vars.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENROUTER_MODEL_FREE
        value: meta-llama/llama-3.1-8b-instruct
      # Lets this process authorize calls from the ai/media/payments Supabase
      # Edge Functions (see supabase/functions/) so they can trigger a
      # realtime Socket.IO broadcast after writing to the database -- this
      # process is the only one with live socket connections. Generate a
      # long random value and set the SAME value as an Edge Function secret
      # (`supabase secrets set INTERNAL_FUNCTIONS_SECRET=...`).
      - key: INTERNAL_FUNCTIONS_SECRET
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: TURN_PUBLIC_HOST
        sync: false
      - key: TURN_PORT
        value: "3478"
      - key: TURN_URLS
        sync: false
      - key: XIRSYS_IDENT
        sync: false
      - key: XIRSYS_SECRET
        sync: false
      - key: XIRSYS_CHANNEL
        sync: false

# The retention-sweep cron service that used to run here has been removed.
# Its entire job (deleting messages past their expires_at timer) now runs as
# a pg_cron job directly inside Supabase Postgres instead -- see
# supabase/migrations/20260921000000_replace_render_cron_with_pg_cron.sql.
# This was the only billed line item in this file (Render has no free tier
# for cron-type services); the web service above has always been on the free
# plan. src/jobs/retention-sweep.ts is kept in the repo as an optional manual
# fallback, but nothing schedules it anymore.
